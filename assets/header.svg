<svg width="100%" height="220" viewBox="0 0 854 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Ocean Deep Gradient -->
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="35%" stop-color="#030919"/>
      <stop offset="70%" stop-color="#081F4D"/>
      <stop offset="100%" stop-color="#113884"/>
    </linearGradient>

    <!-- Deep Wave 1 Gradient -->
    <linearGradient id="hwave-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="25%" stop-color="#06163A"/>
      <stop offset="65%" stop-color="#0E3888"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Mid Wave 2 Gradient -->
    <linearGradient id="hwave-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#010614"/>
      <stop offset="30%" stop-color="#0A2563"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Front Wave 3 Gradient -->
    <linearGradient id="hwave-grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020B20"/>
      <stop offset="35%" stop-color="#123D9E"/>
      <stop offset="75%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3A86FF"/>
    </linearGradient>

    <!-- Ocean Crest Foam/Shimmer Gradient -->
    <linearGradient id="hwave-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="40%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="header-clip">
      <rect width="854" height="220" rx="0"/>
    </clipPath>
  </defs>

  <style>
    .star { animation: star-blink 3s ease-in-out infinite; }
    .star-d1 { animation-delay: 0.7s; }
    .star-d2 { animation-delay: 1.5s; }
    .star-d3 { animation-delay: 2.2s; }
    @keyframes star-blink {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    .header-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif;
      font-size: 58px;
      font-weight: 800;
      letter-spacing: 5px;
      fill: #FFFFFF;
      animation: text-twinkle 4s ease-in-out infinite;
    }

    .header-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 3.5px;
      fill: #BAE6FD;
      animation: text-twinkle 4s ease-in-out infinite;
    }

    @keyframes text-twinkle {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(58,134,255,0.8)); }
      50% { opacity: 0.75; filter: drop-shadow(0 0 4px rgba(29,78,216,0.5)); }
    }
  </style>

